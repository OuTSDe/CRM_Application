# Builds Accord and publishes site/ on GitHub Pages on every push to main.
# Set once in the repository: Settings → Pages → Source: GitHub Actions.
# Settings → Secrets and variables → Actions → Variables: ACCORD_BACKEND_URL = the Apps Script /exec URL
# (from the OuTSDe Google account). Every phone and laptop that opens the site then reads and writes the
# Google Sheet and Drive folders in Accord_Data. The site itself carries no client data.
name: Publish Accord

on:
  push:
    branches: [main]
    paths-ignore: ['backend/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install
        working-directory: source
        run: npm ci
      - name: Build the app and the Accord experience into site/
        working-directory: source
        env:
          ACCORD_BACKEND_URL: ${{ vars.ACCORD_BACKEND_URL }}
        run: npm run build:site
      - name: Check no client data went into the site
        run: |
          if grep -qE 'YSC-C-[0-9]{3}' site/index.html; then echo "Client IDs found in site/index.html, stopping"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
